
<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.4/dist/semantic.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.4/dist/semantic.min.js"></script>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
  <title>rummyscore</title>
</head>
<body>

  <div class="ui top attached menu">
    <div class="ui item">
      <a class="ui header" href="#"><i class="mountain icon"></i></a>
    </div>
    <div class="right menu">
      <div class="ui item" id="menu-avatar-elem">
        <a href="/oauth2/authorization/google"><i class="google icon"></i> login</a>
      </div>
    </div>
  </div>

  <div class="ui container">
    <br />
    <br />
    <br />
    <h1 class="ui header">
      <span id="page-header-elem"></span>
      <span class="sub header" id="page-subheader-elem"></span>
    </h1>

    <br />
    <br />
    <br />
    <h4 class="ui center aligned icon header">
      <i class="circular dice icon"></i> scoreboard
    </h4>

    <br />
    <br />
    <table class="ui very basic celled fluid table">
      <thead>
        <tr>
          <th>player</th>
          <th class="center aligned">round 1</th>
          <th class="center aligned">round 2</th>
          <th class="center aligned">round 3</th>
          <th class="center aligned">round 4</th>
          <th class="center aligned">round 5</th>
          <th class="center aligned">round 6</th>
          <th class="center aligned">round 7</th>
        </tr>
      </thead>
      <tbody>
      <tr>
        <td>
          <h4 class="ui image header">
            <img src="https://api.dicebear.com/9.x/notionists-neutral/svg?seed=doom" class="ui mini rounded image">
            <div class="content">
              <a href="/players/">@doom</a>
            </div>
          </h4>
        </td>
        <td class="center aligned">22</td>
        <td class="center aligned">22</td>
        <td class="center aligned">22</td>
        <td class="center aligned">22</td>
        <td class="center aligned">22</td>
        <td class="center aligned">22</td>
        <td class="center aligned">22</td>
      </tr>
      </tbody>
    </table>

  </div>
  <script>
    fetch('/api/v1/authx/getuserinfo')
      .then(response => {
        if (!response.ok) {
          throw new Error('[ERROR] rummyscore::match.html::fetch::/api/v1/authx/getuserinfo ' + response.statusText);
        }
        return response.json();
      })
      .then(data => {
        console.log('[INFO] rummyscore::match.html::fetch::/api/v1/authx/getuserinfo ' + data);

        document.getElementById('menu-avatar-elem').innerHTML =
            "<a href=\"/players/" + data.nickname + "\">" +
            "<img class=\"ui avatar image\" src=\"" + data.avatar + "\"/>@" + data.nickname +
            "</a>";
      })
      .catch(error => {
          console.error(error);
      });

    let url = window.location.pathname;
    let matchId = url.split("/").at(-1);

    fetch('/api/v1/matches/' + matchId)
      .then(response => {
        if (!response.ok) {
          throw new Error('[ERROR] rummyscore::match.html::fetch::/api/v1/matches/' + matchId + ' ' + response.statusText);
        }
        return response.json();
      })
      .then(data => {
        console.log('[INFO] rummyscore::match.html::fetch::/api/v1/matches/matchId/'  + matchId + ' ' + data);
        document.getElementById("page-header-elem").innerHTML = "<i class=\"dice three icon\"></i> #" + matchId.substring(0,5);
        document.getElementById("page-subheader-elem").innerHTML =
            "<i class=\"user icon\"></i> <a href=\"/players/" + data.host.nickname + "\"\>@" + data.host.nickname + "</a>"
            " " + data.startDate;
      })
      .catch(error => {
        console.error(error);
      });
  </script>
</body>
</html>
