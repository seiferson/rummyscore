
<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.4/dist/semantic.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.4/dist/semantic.min.js"></script>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
  <title>rummyscore</title>
</head>
<body>

  <div class="ui top attached menu">
    <div class="ui item">
      <a class="ui header" href="/"><i class="mountain icon"></i></a>
    </div>
    <div class="right menu">
      <div class="ui item" id="menu-avatar-elem">
        <a href="/oauth2/authorization/google"><i class="google icon"></i> login</a>
      </div>
    </div>
  </div>

  <div class="ui container">
    <br />
    <br />
    <br />
    <h1 class="ui header">
      <span id="page-header-elem"></span>
      <span class="sub header" id="page-subheader-elem"></span>
    </h1>

    <br />
    <br />

    <div class="ui stackable grid">
      <div class="row">
        <div class="five wide column">
          <div class="ui centered card">
            <div class="content">
              <div class="header"><i class="dice one icon"></i> round 1 </div>
              <div class="meta">
                <span><i class="circle check outline icon"></i> 3</span>
              </div>
              <br />
              <div class="ui label"><i class="dice two icon"></i> A♥ A♦ A♣</div>
              <div class="ui label"><i class="dice one icon"></i> 8♥ 9♥ 10♥ J♥</div>
              <br />
              <br />
              <p>
              <form class="ui form">
                <div class="fluid field">
                  <label>your score</label>
                  <input type="text" size="4" name="score" placeholder="123" />
                </div>
                <button class="ui right floated basic icon button" type="submit"><i class="arrow alternate circle up outline icon"></i></button>
              </form>
              </p>
            </div>
          </div>
        </div>
        <div class="eleven wide column">
          <h4 class="ui center aligned icon header">
            <i class="circular dice icon"></i> scoreboard
          </h4>
          <div id="join-placeholder-elem"></div>
          <br />
          <br />
          <table class="ui very basic celled fluid unstackable compact table">
            <thead>
              <tr>
                <th>player</th>
                <th class="center aligned">r1</th>
                <th class="center aligned">r2</th>
                <th class="center aligned">r3</th>
                <th class="center aligned">r4</th>
                <th class="center aligned">r5</th>
                <th class="center aligned">r6</th>
                <th class="center aligned">r7</th>
              </tr>
            </thead>
            <tbody id="scores-elem">
              <tr>
                <td>
                  <a href="/players/">@doomx</a>
                </td>
                <td class="center aligned"><i class="trophy icon"></i></td>
                <td class="center aligned">129</td>
                <td class="center aligned">153</td>
                <td class="center aligned">964</td>
                <td class="center aligned">234</td>
                <td class="center aligned">224</td>
                <td class="center aligned">20</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <br />
  <br />
  <div class="ui basic segment">
    <div class="ui horizontal divider"><i class="mountain icon"></i></div>
    <div class="ui container">
      <div class="ten wide column">
        <div class="ui labels">
          <a class="ui label" href="https://github.com/seiferson/rummyscore">
            <i class="github icon"></i>github
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>

    let url = window.location.pathname;
    let matchId = url.split("/").at(-1);
    let userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    function refreshScoreboard() {
      fetch('/api/v1/matches/' + matchId)
        .then(response => {
          if (!response.ok) {
            throw new Error('[ERROR] rummyscore::match.html::fetch::/api/v1/matches/' + matchId + ' ' + response.statusText);
          }
          return response.json();
        })
        .then(matchData => {
          let scoreboardRows = "";
          matchData.scores.forEach(function(score){
            scoreboardRows +=
                "<tr>" +
                "<td>" +
                "<a href=\"/players/" + score.player.nickname + "\" >@ " + score.player.nickname + "</a>" +
                "</td>" +
                "<td class=\"center aligned\">" + score.round1Score === null ? "-" : score.round1Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round1Score + "</td>" +
                "<td class=\"center aligned\">" + score.round2Score === null ? "-" : score.round2Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round2Score + "</td>" +
                "<td class=\"center aligned\">" + score.round3Score === null ? "-" : score.round3Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round3Score + "</td>" +
                "<td class=\"center aligned\">" + score.round4Score === null ? "-" : score.round4Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round4Score + "</td>" +
                "<td class=\"center aligned\">" + score.round5Score === null ? "-" : score.round5Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round5Score + "</td>" +
                "<td class=\"center aligned\">" + score.round6Score === null ? "-" : score.round6Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round6Score + "</td>" +
                "<td class=\"center aligned\">" + score.round7Score === null ? "-" : score.round7Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round7Score + "</td>" +
                "</tr>";
          });
          document.getElementById("scores-elem").innerHTML = scoreboardRows;
        })
        .catch(error => {
          console.error(error);
        });
    }

    let matchData = fetch('/api/v1/matches/' + matchId)
      .then(response => {
        if (!response.ok) {
          throw new Error('[ERROR] rummyscore::match.html::fetch::/api/v1/matches/' + matchId + ' ' + response.statusText);
        }
        return response.json();
      })
      .catch(error => {
        console.error(error);
      });

    let userData = fetch('/api/v1/authx/getuserinfo')
      .then(response => {
        if (!response.ok) {
          throw new Error('[ERROR] rummyscore::match.html::fetch::/api/v1/authx/getuserinfo ' + response.statusText);
        }
        return response.json();
      })
      .catch(error => {
        console.error(error);
      });

    Promise.all([matchData, userData])
      .then(([matchData, userData]) => {

        console.log(userData);
        if(userData != null){
          document.getElementById('menu-avatar-elem').innerHTML =
              "<a href=\"/players/" + userData.nickname + "\">" +
              "<img class=\"ui avatar image\" src=\"" + userData.avatar + "\"/>@" + userData.nickname +
              "</a>";
        }

        let dateObj = new Date(matchData.startDate);
        let formattedDate = dateObj.toLocaleString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
            hour12: false,
            timeZone: userTimeZone
        });

        document.getElementById("page-header-elem").innerHTML = "<i class=\"dice three icon\"></i> #" + matchId.substring(0,5);
        document.getElementById("page-subheader-elem").innerHTML =
            "<i class=\"user icon\"></i> <a href=\"/players/" + matchData.host.nickname + "\"\>@" + matchData.host.nickname + "</a>" +
            " <i class=\"calendar alternate outline\n icon\"></i>" + formattedDate;

        let scoreboardRows = "";
        matchData.scores.forEach(function(score){
          scoreboardRows +=
              "<tr>" +
              "<td>" +
              "<a href=\"/players/" + score.player.nickname + "\" >@ " + score.player.nickname + "</a>" +
              "</td>" +
              "<td class=\"center aligned\">" + score.round1Score === null ? "-" : score.round1Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round1Score + "</td>" +
              "<td class=\"center aligned\">" + score.round2Score === null ? "-" : score.round2Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round2Score + "</td>" +
              "<td class=\"center aligned\">" + score.round3Score === null ? "-" : score.round3Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round3Score + "</td>" +
              "<td class=\"center aligned\">" + score.round4Score === null ? "-" : score.round4Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round4Score + "</td>" +
              "<td class=\"center aligned\">" + score.round5Score === null ? "-" : score.round5Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round5Score + "</td>" +
              "<td class=\"center aligned\">" + score.round6Score === null ? "-" : score.round6Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round6Score + "</td>" +
              "<td class=\"center aligned\">" + score.round7Score === null ? "-" : score.round7Score === 0 ? "<i class=\"trophy icon\"></i>" : score.round7Score + "</td>" +
              "</tr>";
        });
        document.getElementById("scores-elem").innerHTML = scoreboardRows;

        if (userData != null) {
        let hasPlayerJoinedMatch = matchData.scores.some(score => score.player.nickname === userData.nickname);

        if (!hasPlayerJoinedMatch) {
          document.getElementById("join-placeholder-elem").innerHTML =
              "<button class=\"ui basic right floated icon button\" id=\"join-game-button\">" +
              "<i class=\"sign in alternate icon\"></i>" +
              "</button>";
        }

        let joinRequest = {"matchId": matchId};

        document
          .getElementById("join-game-button")
          .addEventListener("click", function () {
            fetch("/api/v1/scores", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify(joinRequest)
            })
              .then(response => {
                if (!response.ok) {
                  throw new Error('[ERROR] rummyscore::match.html::fetch::/api/v1/scores::post ' + response.statusText);
                }
                return response.json();
              })
              .then(scoreData => {
                refreshScoreboard();
              });
          });
        }
      });
  </script>
</body>
</html>
