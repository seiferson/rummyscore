
<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.4/dist/semantic.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.4/dist/semantic.min.js"></script>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
  <title>rummyscore</title>
</head>
<body>

  <div class="ui top attached menu">
    <div class="ui item">
      <a class="ui header" href="#"><i class="mountain icon"></i></a>
    </div>
    <div class="right menu">
      <div class="ui item" id="menu-avatar-elem">
        <a href="/oauth2/authorization/google"><i class="google icon"></i> login</a>
      </div>
    </div>
  </div>

  <div class="ui container">
    <br />
    <br />
    <br />
    <h1 class="ui header">
      <span id="page-header-elem"></span>
      <span class="sub header" id="page-subheader-elem"></span>
    </h1>

    <br />
    <br />
    <br />

    <div class="ui stackable grid">
      <div class="row">
        <div class="eleven wide column">
          <h4 class="ui center aligned icon header">
            <i class="circular dice icon"></i> scoreboard
          </h4>
          <div id="join-placeholder-elem"></div>
          <br />
          <br />
          <table class="ui very basic celled fluid unstackable compact table">
            <thead>
              <tr>
                <th>player</th>
                <th class="center aligned">r1</th>
                <th class="center aligned">r2</th>
                <th class="center aligned">r3</th>
                <th class="center aligned">r4</th>
                <th class="center aligned">r5</th>
                <th class="center aligned">r6</th>
                <th class="center aligned">r7</th>
              </tr>
            </thead>
            <tbody id="scores-elem">
              <tr>
                <td>
                  <a href="/players/">@doomx</a>
                </td>
                <td class="center aligned"><i class="trophy icon"></i></td>
                <td class="center aligned">129</td>
                <td class="center aligned">153</td>
                <td class="center aligned">964</td>
                <td class="center aligned">435</td>
                <td class="center aligned">224</td>
                <td class="center aligned">20</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <br />
  <br />
  <div class="ui basic segment">
    <div class="ui horizontal divider"><i class="mountain icon"></i></div>
    <div class="ui container">
      <div class="ten wide column">
        <div class="ui labels">
          <a class="ui label" href="https://github.com/seiferson/rummyscore">
            <i class="github icon"></i>github
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>

    let url = window.location.pathname;
    let matchId = url.split("/").at(-1);
    let userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    let matchData = fetch('/api/v1/matches/' + matchId)
      .then(response => {
        if (!response.ok) {
          throw new Error('[ERROR] rummyscore::match.html::fetch::/api/v1/matches/' + matchId + ' ' + response.statusText);
        }
        return response.json();
      });

    let userData = fetch('/api/v1/authx/getuserinfo')
      .then(response => {
        if (!response.ok) {
          throw new Error('[ERROR] rummyscore::match.html::fetch::/api/v1/authx/getuserinfo ' + response.statusText);
        }
        return response.json();
      });

    Promise.all([matchData, userData])
      .then(([matchData, userData]) => {

        let dateObj = new Date(matchData.startDate);
        let formattedDate = dateObj.toLocaleString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
            hour12: false,
            timeZone: userTimeZone
        });
        document.getElementById("page-header-elem").innerHTML = "<i class=\"dice three icon\"></i> #" + matchId.substring(0,5);
        document.getElementById("page-subheader-elem").innerHTML =
            "<i class=\"user icon\"></i> <a href=\"/players/" + matchData.host.nickname + "\"\>@" + matchData.host.nickname + "</a>" +
            " <i class=\"calendar alternate outline\n icon\"></i>" + formattedDate;
        document.getElementById('menu-avatar-elem').innerHTML =
            "<a href=\"/players/" + userData.nickname + "\">" +
            "<img class=\"ui avatar image\" src=\"" + userData.avatar + "\"/>@" + userData.nickname +
            "</a>";

        let hasPlayerJoined = matchData.scores.some(score => score.player.nickname === userData.nickname);

        if(!hasPlayerJoined) {
          document.getElementById("join-placeholder-elem").innerHTML =
              "<button class=\"ui basic right floated icon button\" id=\"join-game-button\">"+
              "<i class=\"sign in alternate icon\"></i>" +
              "</button>";

          let joinRequest = {"matchId" : matchId}

          document
            .getElementById("join-game-button")
            .addEventListener("click", function () {
              fetch("/api/v1/scores", {
                  method: "POST",
                  headers: {
                      "Content-Type": "application/json"
                  },
                  body: JSON.stringify(joinRequest)
              })
                .then(response => {
                  if (!response.ok) {
                    throw new Error('[ERROR] rummyscore::match.html::fetch::/api/v1/scores::post ' + response.statusText);
                  }
                  return response.json();
                })
                .then(scoreData => {
                  document.getElementById("scores-elem").innerHTML = document.getElementById("scores-elem").innerHTML +
                      "<tr>" +
                      "<td>" +
                      "<h4 class=\"ui image header\">" +
                      "<img src=\"" + userData.avatar + "\" class=\"ui mini rounded image\">" +
                      "<div class=\"content\">" +
                      "<a href=\"/players/" + userData.nickname + "\" >@ " + userData.nickname + "</a>" +
                      "</div>" +
                      "</h4>" +
                      "</td>" +
                      "<td class=\"center aligned\">198</td>" +
                      "<td class=\"center aligned\">643</td>" +
                      "<td class=\"center aligned\">753</td>" +
                      "<td class=\"center aligned\">948</td>" +
                      "<td class=\"center aligned\">223</td>" +
                      "<td class=\"center aligned\">932</td>" +
                      "<td class=\"center aligned\">632</td>" +
                      "</tr>";

                  document.getElementById("join-placeholder-elem").innerHTML = "";
              })
              .catch(error => {
                console.error(error);
              });
            });
        }
      });
  </script>
</body>
</html>
