<script>
  fetch('/api/v1/authx/getuserinfo')
    .then(response => {
      if (!response.ok) {
        throw new Error('[ERROR] rummyscore::index.html::fetch::/api/v1/authx/getuserinfo ' + response.statusText);
      }
      return response.json();
    })
    .then(data => {
      console.log('[INFO] rummyscore::index.html::fetch::/api/v1/authx/getuserinfo ' + data);

      document.getElementById('menu-avatar-elem').innerHTML =
          "<a href=\"/players/" + data.nickname + "\">" +
          "<img class=\"ui avatar image\" src=" + data.avatar + "/>@" + data.nickname +
          "</a>";

      document.getElementById("host-placeholder-elem").innerHTML =
          "<button class=\"ui basic right floated icon button\" id=\"host-game-button\">"+
          "<i class=\"plus icon\"></i>" +
          "</button>";

      document
        .getElementById("host-game-button")
        .addEventListener("click", function () {
          fetch("/api/v1/matches", {method: "POST"})
            .then(response => {
              if (!response.ok) {
                throw new Error('[ERROR] rummyscore::index.html::fetch::/api/v1/matches::post ' + response.statusText);
              }
              return response.json();
            })
            .then(data => {
              console.log('[INFO] rummyscore::index.html::fetch::/api/v1/matches::post ' + data);
              refreshFeed();
            })
            .catch(error => {
              console.error(error);
            });
        });
    })
    .catch(error => {
      console.error(error);
    });

  function refreshFeed() {
    fetch('/api/v1/matches?page=0')
      .then(response => {
        if (!response.ok) {
          throw new Error('[ERROR] rummyscore::index.html::fetch::/api/v1/matches::get ' + response.statusText);
        }
        return response.json();
      })
      .then(data => {
        console.log('[INFO] rummyscore::index.html::fetch::/api/v1/matches::get ' + data);

        let feedData = "";
        data.content.forEach( function(event) {
          feedData +=
              "<div class=\"event\">" +
              "<div class=\"label\">" +
              "<img src=" + event.host.avatar +" alt=\"user avatar\">" +
              "</div>" +
              "<div class=\"content\">" +
              "<div class=\"date\">" + event.startDate + "</div>" +
              "<div class=\"summary\">" +
              "<a href=\"/players/" + event.host.nickname + "\" class=\"user\">@" +event.host.nickname + "</a> is hosting " +
              "<a href=\"/matches/" + event.id + "\"> #"+ event.id.substring(0,5) +"</a>" +
              "</div>" +
              "<div class=\"meta\">" +
              "<span><i class=\"user icon\"></i> ?</span>" +
              "</div>" +
              "</div>" +
              "</div>"
        });

        if(!(feedData === "")) {
          document.getElementById("feed-elem").innerHTML = feedData;
        } else {
            document.getElementById("feed-elem").innerHTML = "<div class=\"event\">" +
                "<div class=\"label\">" +
                "<img src=\"https://api.dicebear.com/9.x/notionists-neutral/svg?seed=doom\" alt=\"user avatar\">" +
                "</div>" +
                "<div class=\"content\">" +
                "<div class=\"date\">" + (new Date()).toISOString() + "</div>" +
                "<div class=\"summary\">" +
                "no <events></events>" +
                "</div>" +
                "</div>" +
                "</div>";
        }

      })
      .catch(error => {
        console.error(error);
      });
  }

  refreshFeed();
</script>
